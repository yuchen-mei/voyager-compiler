[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "voyager-compiler"
version = "0.2.0"
description = "A Machine Learning Compiler with native quantization support"
readme = "README.md"
authors = [
  { name = "Jeffrey Yu", email = "jeffreyy@stanford.edu" },
]
requires-python = ">=3.10"

# STABILITY FIRST: Exact versions enforced where critical.
dependencies = [
    "accelerate==1.12.0",
    # PyAV decodes the Video-MME videos, which runs on Python 3.11 or newer.
    # PyAV 18 has no Python 3.10 release, and Voyager's Python 3.10 conda
    # environment for the MatrixUnit HLS flow does not decode video.
    "av==18.1.0; python_version >= '3.11'",
    "datasets==4.5.0",
    "evaluate",
    "graphviz",
    "jiwer",
    "librosa",
    "matplotlib",
    "peft==0.18.1",
    "protobuf",
    "scikit-learn",
    "scipy",
    "sentencepiece",
    "soundfile",
    "tabulate",
    "timm",
    "torch==2.8.0",
    "torchao",
    "transformers==4.57.6",
    "wandb"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"voyager_compiler" = ["*.txt", "*.json"]
